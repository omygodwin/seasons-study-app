<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 850 1100" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="60%" stop-color="#0b1f33"/>
      <stop offset="100%" stop-color="#061421"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1f33" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#0b1f33" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="850" height="1100" fill="url(#bg)"/>

  <!-- Top stripe -->
  <rect x="0"   y="0" width="283" height="22" fill="#c8102e"/>
  <rect x="283" y="0" width="284" height="22" fill="#f5c518"/>
  <rect x="567" y="0" width="283" height="22" fill="#1d7a46"/>

  <!-- Bottom stripe -->
  <rect x="0"   y="1078" width="283" height="22" fill="#c8102e"/>
  <rect x="283" y="1078" width="284" height="22" fill="#f5c518"/>
  <rect x="567" y="1078" width="283" height="22" fill="#1d7a46"/>

  <!-- Brand -->
  <text x="425" y="95"  text-anchor="middle" fill="#f5c518" font-size="26" font-weight="bold" letter-spacing="10">THE</text>
  <text x="425" y="240" text-anchor="middle" font-size="150" font-weight="bold" letter-spacing="4">
    <tspan fill="#ffffff">R</tspan><tspan fill="#f5c518">G</tspan>
  </text>
  <text x="425" y="300" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold" letter-spacing="8">SPORTS BAR</text>
  <rect x="170" y="322" width="510" height="3" fill="url(#rule)"/>

  <!-- Headline -->
  <text x="425" y="410" text-anchor="middle" fill="#f5c518" font-size="38" font-weight="bold" font-style="italic">Happy</text>
  <text x="425" y="490" text-anchor="middle" fill="#ffffff" font-size="80" font-weight="bold" letter-spacing="2">FATHER'S</text>
  <text x="425" y="575" text-anchor="middle" fill="#c8102e" stroke="#ffffff" stroke-width="2" font-size="86" font-weight="bold" letter-spacing="6">DAY</text>

  <!-- Special box -->
  <rect x="70" y="630" width="710" height="320" rx="20" fill="#f5c518" stroke="#ffffff" stroke-width="5"/>

  <!-- tag pill -->
  <rect x="305" y="652" width="240" height="38" rx="19" fill="#c8102e"/>
  <text x="425" y="678" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="3">DAD'S DAY SPECIAL</text>

  <!-- deal -->
  <text x="425" y="752" text-anchor="middle" fill="#0b1f33" font-size="48" font-weight="bold">
    <tspan fill="#c8102e">BUY 1</tspan> BEER,
  </text>
  <text x="425" y="808" text-anchor="middle" fill="#0b1f33" font-size="48" font-weight="bold">
    GET 1 <tspan fill="#c8102e">HALF OFF</tspan>
  </text>

  <!-- sub -->
  <text x="425" y="868" text-anchor="middle" fill="#0b1f33" font-size="24" font-weight="bold">Free wings with any entree for Dad!</text>

  <!-- fine print -->
  <text x="425" y="912" text-anchor="middle" fill="#4b3a00" font-size="15">Valid Father's Day only  -  Dine-in  -  One special per guest</text>

  <!-- Footer -->
  <text x="425" y="1012" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">Sunday, June 21, 2026   -   Doors Open 11 AM</text>
  <text x="425" y="1048" text-anchor="middle" fill="#f5c518" font-size="17" font-weight="bold" letter-spacing="4">CHEERS TO ALL THE DADS!</text>
</svg>
